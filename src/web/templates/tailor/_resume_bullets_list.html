{# Bullets list for one experience entry. Vars: session_id, exp_index, bullets (list of strings). #}
<ul id="exp-bullets-{{ exp_index }}" class="space-y-1">
  {% for bullet in bullets %}
    {% with session_id=session_id, exp_index=exp_index, bullet_index=loop.index0, value=bullet %}
      {% include "tailor/_resume_bullet.html" %}
    {% endwith %}
  {% endfor %}
  <li>
    <button type="button"
            class="text-xs text-indigo-500 hover:text-indigo-700 ml-5"
            hx-post="/tailor/{{ session_id }}/result/bullet/add"
            hx-vals='{"experience_index": "{{ exp_index }}"}'
            hx-target="#exp-bullets-{{ exp_index }}"
            hx-swap="outerHTML">
      + add bullet
    </button>
  </li>
</ul>
