<div class="mb-5">
  <div class="flex items-baseline justify-between mb-0.5">
    <span class="font-semibold text-gray-900">{{ loop_exp.title }}</span>
    <span class="text-sm text-gray-400">{{ loop_exp.dates }}</span>
  </div>
  <div class="text-sm text-gray-500 mb-2">{{ loop_exp.company }}</div>
  <ul class="space-y-1">
    {% for bullet in loop_exp.bullets %}
    <li class="text-sm text-gray-700 flex gap-2">
      <span class="text-gray-300 shrink-0 mt-0.5">•</span>
      <span>{{ bullet }}</span>
    </li>
    {% endfor %}
  </ul>
</div>
