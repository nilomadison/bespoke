<div id="achievement-{{ achievement.id }}" class="bg-indigo-50 rounded-lg border border-indigo-200 px-4 py-3">
  <form hx-post="/jobs/{{ job_id }}/achievements/{{ achievement.id }}"
        hx-target="#achievement-{{ achievement.id }}"
        hx-swap="outerHTML"
        class="space-y-2">
    <div>
      <textarea name="text" rows="2" required
                class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">{{ achievement.text }}</textarea>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <div>
        <input type="text" name="metric" placeholder="Metric"
               value="{{ achievement.metric or '' }}"
               class="w-full rounded border border-gray-300 px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <input type="text" name="impact_tags" placeholder="Tags (comma-separated)"
               value="{{ achievement.impact_tags | join(', ') }}"
               class="w-full rounded border border-gray-300 px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <input type="number" name="prominence" min="1" max="5"
               value="{{ achievement.prominence }}"
               class="w-full rounded border border-gray-300 px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>
    <div class="flex gap-2">
      <button type="submit"
              class="px-3 py-1 bg-indigo-600 text-white text-xs font-medium rounded hover:bg-indigo-700">
        Save
      </button>
      <button type="button"
              hx-get="/jobs/{{ job_id }}/achievements/{{ achievement.id }}"
              hx-target="#achievement-{{ achievement.id }}"
              hx-swap="outerHTML"
              class="px-3 py-1 text-xs text-gray-600 rounded border border-gray-300 hover:bg-gray-50">
        Cancel
      </button>
    </div>
  </form>
</div>
