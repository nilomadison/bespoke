<div id="cover-letter-status" class="rounded-lg bg-red-50 border border-red-200 px-5 py-4 text-sm text-red-800">
  <p class="font-medium mb-1">Cover letter generation failed.</p>
  <p class="text-xs text-red-600 font-mono">{{ session.error_message }}</p>
  <div class="mt-3 flex items-center gap-3">
    <form method="post"
          action="/tailor/{{ session.id }}/cover-letter"
          onsubmit="this.querySelector('button').disabled = true">
      <button type="submit"
              class="text-xs px-3 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700">
        Retry cover letter
      </button>
    </form>
    <a href="/tailor/{{ session.id }}/result" class="text-xs text-gray-500 hover:text-indigo-600">← Back to resume</a>
  </div>
</div>
