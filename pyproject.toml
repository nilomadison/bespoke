[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bespoke"
version = "0.1.0"
description = "Local-first career database and tailored resume generator"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
    "sqlalchemy>=2.0.38",
    "alembic>=1.13",
    "httpx==0.27.2",
    "python-docx==1.1.2",
    "pyyaml==6.0.2",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends()/Form() in parameter defaults is the framework idiom
"src/web/routes/*" = ["B008"]
