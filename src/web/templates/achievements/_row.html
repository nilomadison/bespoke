<div id="achievement-{{ achievement.id }}" class="bg-white rounded-lg border border-gray-200 px-4 py-3">
  <div class="flex items-start justify-between gap-3">
    <div class="flex-1 min-w-0">
      <p class="text-sm text-gray-800">{{ achievement.text }}</p>
      {% if achievement.metric %}
      <p class="text-xs text-indigo-600 mt-0.5 font-medium">{{ achievement.metric }}</p>
      {% endif %}
      <div class="flex flex-wrap gap-1 mt-1.5">
        {% for tag in achievement.impact_tags %}
        <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">{{ tag }}</span>
        {% endfor %}
        <span class="text-xs text-gray-400 ml-1">prominence {{ achievement.prominence }}/5</span>
      </div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button hx-get="/jobs/{{ job_id }}/achievements/{{ achievement.id }}/edit"
              hx-target="#achievement-{{ achievement.id }}"
              hx-swap="outerHTML"
              class="text-xs text-gray-500 hover:text-indigo-600 px-2 py-1 rounded border border-gray-200 hover:border-indigo-300">
        Edit
      </button>
      <button hx-post="/jobs/{{ job_id }}/achievements/{{ achievement.id }}/delete"
              hx-target="#achievement-{{ achievement.id }}"
              hx-swap="outerHTML"
              hx-confirm="Delete this achievement?"
              class="text-xs text-red-500 hover:text-red-700 px-2 py-1 rounded border border-gray-200 hover:border-red-300">
        Delete
      </button>
    </div>
  </div>
</div>
