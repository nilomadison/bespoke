{% extends "_base.html" %}
{% block title %}Skills — {{ app_title }}{% endblock %}
{% block content %}
<div class="max-w-3xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Skills</h1>

  <!-- Add skill form -->
  <form hx-post="/skills/"
        hx-target="#skill-list-body"
        hx-swap="afterbegin"
        hx-on::after-request="this.reset()"
        class="bg-white rounded-lg border border-gray-200 p-4 mb-6 flex gap-3 items-end">
    <div class="flex-1">
      <label class="block text-xs font-medium text-gray-600 mb-1">Skill name *</label>
      <input type="text" name="name" required placeholder="e.g. Python"
             class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="w-40">
      <label class="block text-xs font-medium text-gray-600 mb-1">Category</label>
      <input type="text" name="category" placeholder="Languages"
             class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded hover:bg-indigo-700 shrink-0">
      Add
    </button>
  </form>

  {% if skills %}
  <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="text-left px-4 py-3 text-xs font-medium text-gray-500 uppercase tracking-wide">Skill</th>
          <th class="text-left px-4 py-3 text-xs font-medium text-gray-500 uppercase tracking-wide">Category</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="skill-list-body" class="divide-y divide-gray-100">
        {% for skill in skills %}
          {% include "skills/_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div id="skill-list-body">
    <p class="text-sm text-gray-400 text-center py-10">No skills yet. Add the first one above.</p>
  </div>
  {% endif %}
</div>
{% endblock %}
