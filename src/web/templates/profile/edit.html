{% extends "_base.html" %}
{% block title %}Profile — {{ app_title }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Your Profile</h1>

  {% if saved %}
  <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800">
    Saved.
  </div>
  {% endif %}

  <form method="post" action="/profile" class="space-y-5 bg-white rounded-lg border border-gray-200 p-6">

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full name *</label>
        <input type="text" name="full_name" value="{{ profile.full_name }}" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
        <input type="email" name="email" value="{{ profile.email }}" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="text" name="phone" value="{{ profile.phone or '' }}"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <input type="text" name="location" value="{{ profile.location or '' }}"
               placeholder="City, State"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn URL</label>
      <input type="url" name="linkedin_url" value="{{ profile.linkedin_url or '' }}"
             class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">GitHub URL</label>
      <input type="url" name="github_url" value="{{ profile.github_url or '' }}"
             class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Portfolio URL</label>
      <input type="url" name="portfolio_url" value="{{ profile.portfolio_url or '' }}"
             class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Baseline summary</label>
      <textarea name="baseline_summary" rows="4"
                placeholder="A general professional summary — the LLM will tailor this per application."
                class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">{{ profile.baseline_summary or '' }}</textarea>
    </div>

    <div class="pt-2">
      <button type="submit"
              class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded hover:bg-indigo-700">
        Save profile
      </button>
    </div>

  </form>
</div>
{% endblock %}
