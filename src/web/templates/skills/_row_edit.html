<tr id="skill-{{ skill.id }}">
  <form hx-post="/skills/{{ skill.id }}"
        hx-target="#skill-{{ skill.id }}"
        hx-swap="outerHTML">
    <td class="px-4 py-2">
      <input type="text" name="name" value="{{ skill.name }}" required
             class="w-full rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </td>
    <td class="px-4 py-2">
      <input type="text" name="category" value="{{ skill.category or '' }}"
             class="w-full rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </td>
    <td class="px-4 py-2 text-right">
      <div class="flex gap-2 justify-end">
        <button type="submit"
                class="text-xs px-2 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700">
          Save
        </button>
        <button type="button"
                hx-get="/skills/{{ skill.id }}"
                hx-target="#skill-{{ skill.id }}"
                hx-swap="outerHTML"
                class="text-xs text-gray-500 px-2 py-1 rounded border border-gray-200 hover:bg-gray-50">
          Cancel
        </button>
      </div>
    </td>
  </form>
</tr>
