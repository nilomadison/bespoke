{% extends "_base.html" %}
{% block title %}New Application — {{ app_title }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="/tailor/" class="text-sm text-gray-500 hover:text-indigo-600">&larr; Applications</a>
    <span class="text-gray-300">/</span>
    <h1 class="text-2xl font-bold text-gray-900">New application</h1>
  </div>

  <form method="post" action="/tailor/"
        class="bg-white rounded-lg border border-gray-200 p-6 space-y-5">

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Job title *</label>
        <input type="text" name="job_title" required placeholder="Senior Software Engineer"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Company *</label>
        <input type="text" name="company_name" required placeholder="Acme Corp"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Job description *</label>
      <p class="text-xs text-gray-400 mb-2">Paste the full job posting. More text = better analysis.</p>
      <textarea name="job_description" rows="14" required
                placeholder="Paste the full job description here..."
                class="w-full rounded border border-gray-300 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="px-5 py-2 bg-indigo-600 text-white text-sm font-medium rounded hover:bg-indigo-700">
        Analyze &amp; build plan
      </button>
      <a href="/tailor/"
         class="px-4 py-2 text-sm text-gray-600 rounded border border-gray-300 hover:bg-gray-50">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
