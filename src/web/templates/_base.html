<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.2" integrity="sha384-Y7hw+L/jvKeWIRRkqWYfPcvVxHzVzn5REgzbawhxAuQGwX1XWe70vji+VSeHOThJ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body class="h-full flex">

  <!-- Sidebar nav -->
  <nav class="w-52 shrink-0 bg-white border-r border-gray-200 flex flex-col">
    <div class="px-4 py-5 border-b border-gray-200">
      <span class="text-lg font-bold text-indigo-600">{{ app_title }}</span>
    </div>
    <ul class="flex-1 py-4 space-y-1 px-2">
      <li>
        <a href="/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Home
        </a>
      </li>
      <li>
        <a href="/profile"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Profile
        </a>
      </li>
      <li>
        <a href="/jobs/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Experience
        </a>
      </li>
      <li>
        <a href="/skills/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Skills
        </a>
      </li>
      <li>
        <a href="/projects/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Projects
        </a>
      </li>
      <li>
        <a href="/education/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Education
        </a>
      </li>
      <li>
        <a href="/certifications/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">
          Certifications
        </a>
      </li>
      <li class="pt-4 border-t border-gray-100 mt-4">
        <a href="/tailor/"
           class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold text-indigo-700 hover:bg-indigo-50">
          Tailor Resume
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main content -->
  <main class="flex-1 overflow-auto p-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
