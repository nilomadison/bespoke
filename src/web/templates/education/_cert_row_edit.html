<div id="cert-{{ cert.id }}" class="bg-indigo-50 rounded-lg border border-indigo-200 px-4 py-3">
  <form hx-post="/certifications/{{ cert.id }}"
        hx-target="#cert-{{ cert.id }}"
        hx-swap="outerHTML"
        class="space-y-3">
    <div class="grid grid-cols-3 gap-3">
      <input type="text" name="name" value="{{ cert.name }}" required placeholder="Name"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <input type="text" name="issuer" value="{{ cert.issuer }}" required placeholder="Issuer"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <input type="date" name="issue_date"
             value="{{ cert.issue_date.isoformat() if cert.issue_date else '' }}"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="grid grid-cols-3 gap-3">
      <input type="date" name="expiry_date"
             value="{{ cert.expiry_date.isoformat() if cert.expiry_date else '' }}"
             placeholder="Expiry"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <input type="text" name="credential_id" value="{{ cert.credential_id or '' }}"
             placeholder="Credential ID"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <input type="url" name="credential_url" value="{{ cert.credential_url or '' }}"
             placeholder="Credential URL"
             class="rounded border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="flex gap-2">
      <button type="submit"
              class="px-3 py-1 bg-indigo-600 text-white text-xs font-medium rounded hover:bg-indigo-700">
        Save
      </button>
      <button type="button"
              hx-get="/certifications/{{ cert.id }}/view"
              hx-target="#cert-{{ cert.id }}"
              hx-swap="outerHTML"
              class="px-3 py-1 text-xs text-gray-600 rounded border border-gray-300 hover:bg-gray-50">
        Cancel
      </button>
    </div>
  </form>
</div>
