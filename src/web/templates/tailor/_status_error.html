{% set stage = stage | default("analysis") %}
<div id="analysis-status" class="rounded-lg bg-red-50 border border-red-200 px-5 py-4 text-sm text-red-800">
  <p class="font-medium mb-1">
    {% if stage == "generation" %}Generation failed.{% else %}Analysis failed.{% endif %}
  </p>
  <p class="text-xs text-red-600 font-mono">{{ session.error_message }}</p>
  <div class="mt-3 flex items-center gap-3">
    <form method="post"
          action="/tailor/{{ session.id }}/retry-{{ stage }}">
      <button type="submit"
              class="text-xs px-3 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700">
        {% if stage == "generation" %}Retry generation{% else %}Retry analysis{% endif %}
      </button>
    </form>
    <a href="/tailor/new" class="text-xs text-gray-500 hover:text-indigo-600">Start a new session</a>
  </div>
</div>
