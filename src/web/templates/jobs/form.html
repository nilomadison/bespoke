{% extends "_base.html" %}
{% block title %}{{ 'Edit' if job else 'New' }} Job — {{ app_title }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="/jobs/" class="text-sm text-gray-500 hover:text-indigo-600">&larr; Experience</a>
    <span class="text-gray-300">/</span>
    <h1 class="text-2xl font-bold text-gray-900">
      {{ 'Edit job' if job else 'Add job' }}
    </h1>
  </div>

  <form method="post"
        action="{{ '/jobs/' + job.id|string if job else '/jobs/' }}"
        class="space-y-5 bg-white rounded-lg border border-gray-200 p-6">

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
        <input type="text" name="title" value="{{ job.title if job else '' }}" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Company *</label>
        <input type="text" name="company" value="{{ job.company if job else '' }}" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <input type="text" name="location" value="{{ job.location if job else '' }}"
               placeholder="City, State or Remote"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Employment type</label>
        <select name="employment_type"
                class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          {% for et in employment_types %}
          <option value="{{ et }}"
                  {% if job and job.employment_type.value == et %}selected{% endif %}>
            {{ et.replace('_', ' ').title() }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Start date *</label>
        <input type="date" name="start_date"
               value="{{ job.start_date.isoformat() if job else '' }}" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">End date <span class="font-normal text-gray-400">(leave blank if current)</span></label>
        <input type="date" name="end_date"
               value="{{ job.end_date.isoformat() if job and job.end_date else '' }}"
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Role summary <span class="font-normal text-gray-400">(context for the LLM, not a resume bullet)</span></label>
      <textarea name="summary" rows="3"
                placeholder="Describe the scope of the role, the team, the domain..."
                class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">{{ job.summary if job else '' }}</textarea>
    </div>

    <div class="flex items-center gap-6">
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="is_technical"
               {% if not job or job.is_technical %}checked{% endif %}
               class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-400">
        Technical role
      </label>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Sort order</label>
        <input type="number" name="sort_order" value="{{ job.sort_order if job else 0 }}"
               class="w-20 rounded border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded hover:bg-indigo-700">
        {{ 'Save changes' if job else 'Add job' }}
      </button>
      <a href="{{ '/jobs/' + job.id|string if job else '/jobs/' }}"
         class="px-4 py-2 text-sm text-gray-600 rounded border border-gray-300 hover:bg-gray-50">
        Cancel
      </a>
    </div>

  </form>
</div>
{% endblock %}
